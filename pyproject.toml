[project]
name = "atml-pa4"
version = "0.1.0"
description = "ATML Programming Assignment 4 - Efficiency & Compression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers==4.57.1",
    "datasets>=3.0.0,<5.0.0",
    "huggingface-hub==0.36.2",
    "accelerate>=0.34.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
modal = [
    "modal>=0.60.0",
]
dev = [
    "pytest>=8.0.0",
]
